services:
  db:
    image: pgvector/pgvector:pg16
    container_name: video-rag-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: video-rag-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_SECURE=${S3_SECURE}
    depends_on:
      - db

  crawler-worker-facebook:
    build:
      context: .
      dockerfile: video_crawler/Dockerfile
    container_name: video-rag-crawler-facebook
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - CRAWLER_PLATFORM=facebook
    volumes:
      - ./video_crawler/var/secrets/sessions:/app/video_crawler/var/secrets/sessions:ro
      - ./video_crawler/topics.json:/app/video_crawler/topics.json:ro
      - crawler_work:/app/data/crawler-work
    depends_on:
      - db

  crawler-worker-tiktok:
    build:
      context: .
      dockerfile: video_crawler/Dockerfile
    container_name: video-rag-crawler-tiktok
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - CRAWLER_PLATFORM=tiktok
    volumes:
      - ./video_crawler/var/secrets/sessions:/app/video_crawler/var/secrets/sessions:ro
      - ./video_crawler/topics.json:/app/video_crawler/topics.json:ro
      - crawler_work:/app/data/crawler-work
    depends_on:
      - db

  crawler-worker-youtube:
    build:
      context: .
      dockerfile: video_crawler/Dockerfile
    container_name: video-rag-crawler-youtube
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - CRAWLER_PLATFORM=youtube
    volumes:
      - ./video_crawler/var/secrets/sessions:/app/video_crawler/var/secrets/sessions:ro
      - ./video_crawler/topics.json:/app/video_crawler/topics.json:ro
      - crawler_work:/app/data/crawler-work
    depends_on:
      - db

  web:
    image: node:22-alpine
    container_name: video-rag-web
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    
  stt:
    build:
      context: .
      dockerfile: services/stt_service/Dockerfile
    container_name: video-rag-stt
    restart: always
    ports:
      - "3001:3000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


volumes:
  postgres_data:
  web_node_modules:
  crawler_work:
