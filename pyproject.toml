[project]
name = "rag-viral-video"
version = "0.1.0"
description = "Nền tảng RAG phân tích pattern video viral và sinh kịch bản short-form video (TikTok, Reels, Shorts) theo chuẩn Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",

    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.3",
    "dishka>=1.4.0",
    "greenlet>=3.0",
    "alembic>=1.13.0",
    "email-validator>=2.0.0",
    "aiosqlite>=0.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "module", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", ".agents", ".agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["core", "module", "backend"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File", "fastapi.params.File"]


[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["^\\.venv/", "^\\.agents/", "^\\.agent/"]

