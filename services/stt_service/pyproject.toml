[project]
name = "stt-service"
version = "0.1.0"
description = "WhisperX & Pyannote Audio STT Microservice"
requires-python = ">=3.10,<3.13"
dependencies = [
    "bentoml>=1.4.39",
    "whisperx>=3.3.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pyannote.audio>=3.1.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
